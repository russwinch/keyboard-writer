# Tests the app, builds it, and runs it through a whole flash against pretend
# drives, keeping screenshots of each stage.
name: App

on:
  push:
    paths-ignore: ["firmware/**", "zephyr/**", "**.md"]
  workflow_dispatch:

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: swift test

      - name: Build the app
        run: ./build.sh

      - name: Run it against pretend drives
        run: ./smoke.sh "$RUNNER_TEMP/screenshots"

      - name: TEMPORARY push the screenshots to a branch
        if: always()
        run: |
          cd "$RUNNER_TEMP/screenshots"
          git init -q -b screenshots-tmp
          git add .
          git -c user.name=ci -c user.email=ci@example.invalid commit -qm screenshots
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" screenshots-tmp

      - name: Shrink the screenshots
        if: always()
        run: sips -Z 1600 "$RUNNER_TEMP"/screenshots/*.png || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore
