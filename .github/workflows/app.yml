# Tests the app, builds it, and runs it through a whole flash against pretend
# drives, keeping screenshots of each stage. A run on main that passes
# publishes the app as a release, tagged with its version; install.sh fetches
# the latest one.
name: App

on:
  push:
    paths-ignore: ["firmware/**", "zephyr/**", "**.md"]
  workflow_dispatch:

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # to publish the release

env:
  VERSION: 1.${{ github.run_number }}

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: swift test

      - name: Build the app
        run: ./build.sh

      - name: Run it against pretend drives
        env:
          GITHUB_TOKEN: ${{ github.token }}  # for the list of builds
        run: ./smoke.sh "$RUNNER_TEMP/screenshots"

      - name: Shrink the screenshots
        if: always()
        run: sips -Z 1600 "$RUNNER_TEMP"/screenshots/*.png || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore

      - name: Publish the app as a release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ditto -c -k --keepParent "build/Keyboard Writer.app" "$RUNNER_TEMP/Keyboard-Writer.zip"
          gh release create "v$VERSION" "$RUNNER_TEMP/Keyboard-Writer.zip" \
            --target "$GITHUB_SHA" --title "Keyboard Writer $VERSION" --generate-notes
