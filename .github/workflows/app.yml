# Tests the app, builds it, and runs it through a whole flash against pretend
# drives, keeping screenshots of each stage.
name: App

on:
  push:
    paths-ignore: ["firmware/**", "zephyr/**", "**.md"]
  workflow_dispatch:

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: swift test

      - name: Build the app
        run: ./build.sh

      - name: Run it against pretend drives
        run: ./smoke.sh "$RUNNER_TEMP/screenshots"

      - name: Shrink the screenshots
        if: always()
        run: sips -Z 1600 "$RUNNER_TEMP"/screenshots/*.png || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore
